# NEXLOGISTIC – Datenbank-Migrationen aus supabase/migrations automatisch in Supabase einspielen
#
# NEXLOGISTIC nutzt dasselbe Supabase-Projekt wie NEXCOUNT, führt aber ein eigenes
# Migrationsprotokoll (scripts/migrate.mjs) – daher kein `supabase db push`.
#
# Einmalig nötig (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  – Supabase → Account → Access Tokens → „Generate new token“
#                            (derselbe Token wie bei NEXCOUNT funktioniert)
# Ohne das Secret wird der Schritt mit einem Hinweis übersprungen (kein Fehler).
name: Supabase-Datenbank

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/migrate.mjs'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrationen einspielen
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: xrzovtfaqthaxucaoale
    steps:
      - name: Zugangsdaten prüfen
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Supabase nicht verbunden::Das Secret SUPABASE_ACCESS_TOKEN fehlt (Settings → Secrets and variables → Actions). Migrationen wurden übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Neue Migrationen einspielen
        if: steps.check.outputs.ready == 'true'
        run: node scripts/migrate.mjs
